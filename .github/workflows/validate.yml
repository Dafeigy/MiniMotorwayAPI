name: Validate

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate API contract and Python smoke tests
        run: python tests/contracttest.py
